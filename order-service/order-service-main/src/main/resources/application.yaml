#Change order service running port
server:
  port: 0

spring:
  application:
    name: order-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery: # spring cloud nacos discovery
        namespace: ${spring.profiles.active}
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_order
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
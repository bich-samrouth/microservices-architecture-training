#Change order service running port
server:
  port: 8583
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery: # spring cloud nacos discovery
        namespace: ${spring.profiles.active}
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos

  # config with postgresql
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_user
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # config security with keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/ecommerce
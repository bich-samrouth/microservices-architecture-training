#Change order service running port
server:
  port: 8582
  forward-headers-strategy: framework

spring:
  application:
    name: business-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery: # spring cloud nacos discovery
        namespace: ${spring.profiles.active}
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_business
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true